# Render blueprint. Point Render at this repo; it stands up the backend under
# one public URL. Set GEMINI_API_KEY and DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: sales-inbox-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
